AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: python3.9
    Timeout: 10

Resources:

  ############################
  # DynamoDB Table
  ############################
  FileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: file_id
          AttributeType: S
      KeySchema:
        - AttributeName: file_id
          KeyType: HASH

  ############################
  # S3 Bucket
  ############################
  FileBucket:
    Type: AWS::S3::Bucket

  ############################
  # Lambda: Generate Upload URL
  ############################
  GenerateUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/generate_upload_url/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref FileTable
          BUCKET_NAME: !Ref FileBucket
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref FileTable
        - S3WritePolicy:
            BucketName: !Ref FileBucket
      Events:
        UploadApi:
          Type: Api
          Properties:
            Path: /upload-url
            Method: POST

  ############################
  # Lambda: Process Uploaded File
  ############################
  ProcessUploadedFileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/process_uploaded_file/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref FileTable
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref FileTable
      Events:
        FileUpload:
          Type: S3
          Properties:
            Bucket: !Ref FileBucket
            Events: s3:ObjectCreated:*

  ############################
  # Lambda: Get File Status
  ############################
  GetFileStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/get_file_status/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref FileTable
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref FileTable
      Events:
        GetStatus:
          Type: Api
          Properties:
            Path: /files/{file_id}
            Method: GET


